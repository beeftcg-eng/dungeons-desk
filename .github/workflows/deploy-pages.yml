# Builds the phone app (scripts/build-web.js) and publishes it to GitHub Pages on every push to main:
# https://beeftcg-eng.github.io/dungeons-desk/ (the DM app at dm/, the standalone character sheet at sheet/).
# Pages must be set to "GitHub Actions" in the repository's Settings → Pages.
name: Deploy phone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The phone app only needs marked and js-yaml from node_modules, not Electron itself.
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: node scripts/build-web.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-web }

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
