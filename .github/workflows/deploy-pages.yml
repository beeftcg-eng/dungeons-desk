# Builds the phone app (scripts/build-web.js), smoke-tests it, and publishes it to GitHub Pages on every push to main:
# https://beeftcg-eng.github.io/dungeons-desk/ (the DM app at dm/, the standalone character sheet at sheet/).
# Pages must be set to "GitHub Actions" in the repository's Settings → Pages.
name: Deploy phone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # The phone app only needs marked and js-yaml from node_modules, not Electron itself.
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: node scripts/build-web.js
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist-web }

  # Opens the built phone app in Electron (scripts/smoke-web.js): every DM view, the sheet app and the players' page,
  # then plays a LAN game with a phone (scripts/smoke-phone.js).
  # Any console error or missing file fails it, and then nothing is deployed. Screenshots are kept when it fails.
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Electron fetches its own program on first use; get it now.
      - run: node node_modules/electron/install.js && test -x node_modules/electron/dist/electron
      - run: sudo apt-get update -q && sudo apt-get install -yq xvfb
      - run: node scripts/build-web.js
      - name: Smoke test
        run: |
          for P in dm sheet play; do
            mkdir -p shots/$P
            echo "== $P"
            SHOTS=shots/$P PAGE=$P CHECK=1 timeout 280 xvfb-run -a node scripts/run-electron.js scripts/smoke-web.js --disable-gpu
          done
      # The desktop app with a LAN game and a phone: recap, rest, Inspiration, XP, the level-up guide, treasure.
      - name: Phone page, end to end
        run: SHOTS=shots/phone timeout 300 xvfb-run -a node scripts/smoke-phone.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: smoke-shots, path: shots }

  deploy:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
