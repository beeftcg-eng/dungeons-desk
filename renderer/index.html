<title>Dungeons Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Caveat:wght@500&family=Homemade+Apple&family=Special+Elite&family=UnifrakturMaguntia&display=swap">

<body>
<div id="app">
  <nav id="rail">
    <div class="brand" title="Dungeons Desk"><img src="../build/icon-128.png" alt="Dungeons Desk"></div>
    <button id="campaign-btn" class="campaign-btn"><span>🗺</span><b id="campaign-name">Campaign</b></button>
    <button data-view="notes" data-m="2" class="active" title="Notes & Campaign Wiki"><span>📜</span>Notes</button>
    <button data-view="generators" title="NPC & Monster Generator"><span>🎲</span>Generate</button>
    <button data-view="initiative" data-m="3" title="Initiative Tracker & Encounter Builder"><span>⏳</span>Initiative</button>
    <button data-view="maps" data-m="4" title="Battle Maps with Fog of War"><span>🧭</span>Map</button>
    <button data-view="tokens" title="Token Maker"><span>🪙</span>Tokens</button>
    <button data-view="handouts" title="Player Handouts"><span>✉</span>Handouts</button>
    <button data-view="loot" title="Loot Tables"><span>💰</span>Loot</button>
    <button data-view="timeline" title="Timeline & Calendar"><span>📅</span>Timeline</button>
    <button data-view="rules" title="Rules Reference (SRD)"><span>📖</span>Rules</button>
    <button data-view="session" data-m="1" title="Session: the fight, dice, party and pinned notes on one screen"><span>🎬</span>Session</button>
    <button class="more-btn" title="All tools"><span>⋯</span>More</button>
    <div class="spacer"></div>
    <button data-view="settings" title="Settings & Party"><span>⚙</span>Settings</button>
  </nav>
  <main>
    <section id="view-notes" class="view active"></section>
    <section id="view-generators" class="view"></section>
    <section id="view-tokens" class="view"></section>
    <section id="view-handouts" class="view"></section>
    <section id="view-loot" class="view"></section>
    <section id="view-initiative" class="view"></section>
    <section id="view-maps" class="view"></section>
    <section id="view-timeline" class="view"></section>
    <section id="view-rules" class="view"></section>
    <section id="view-session" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
